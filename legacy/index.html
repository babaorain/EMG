<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMG Diagnosis Tool</title>
    <style>
        :root {
            --primary: #0ea5e9;
            /* Sky 500 */
            --primary-dark: #0284c7;
            /* Sky 600 */
            --bg: #f8fafc;
            /* Slate 50 */
            --card-bg: #ffffff;
            --text-main: #334155;
            /* Slate 700 */
            --text-muted: #64748b;
            /* Slate 500 */
            --border: #e2e8f0;
            /* Slate 200 */

            --success: #22c55e;
            /* Green 500 */
            --success-bg: #f0fdf4;
            --danger: #ef4444;
            /* Red 500 */
            --danger-bg: #fef2f2;
            --warning: #f59e0b;
            /* Amber 500 */
            --warning-bg: #fffbeb;

            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -2px rgb(0 0 0 / 0.05);
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        /* --- LAYOUT --- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (min-width: 900px) {
            .main-grid {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 85vh;
            /* Viewport height limit */
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        /* --- SEARCH & FILTERS --- */
        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
            background: #f1f5f9;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            display: block;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 999px;
            background: white;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* --- CANDIDATE LIST --- */
        .candidate-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            align-content: start;
        }

        .candidate-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .candidate-item:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .cand-abbr {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.7rem;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .cand-name {
            display: block;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            font-size: 0.95rem;
            padding-right: 30px;
            /* Space for abbr */
        }

        .cand-meta {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* --- EXAM LIST --- */
        .exam-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 5px;
            min-height: 200px;
        }

        .exam-item {
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 12px;
            transition: all 0.2s;
        }

        @media (min-width: 600px) {
            .exam-item {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .exam-info {
            margin-bottom: 10px;
        }

        @media (min-width: 600px) {
            .exam-info {
                margin-bottom: 0;
                flex-grow: 1;
            }
        }

        .exam-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 1rem;
            display: block;
        }

        .exam-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .exam-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-btn {
            border: 1px solid var(--border);
            background: white;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-btn:hover {
            background: #f8fafc;
        }

        .status-btn.active-normal {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .status-btn.active-abnormal {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .btn-remove {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 50%;
            font-size: 1.2rem;
            margin-left: 5px;
        }

        .btn-remove:hover {
            background: #f1f5f9;
            color: var(--danger);
        }

        /* --- ANALYSIS --- */
        .analysis-section {
            background: #f8fafc;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border);
        }

        .analysis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .analysis-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .lesion-card {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 4px solid transparent;
            font-size: 0.95rem;
        }

        .lesion-card h4 {
            margin: 0 0 4px 0;
            font-size: 1rem;
        }

        .lesion-normal {
            background: var(--success-bg);
            border-left-color: var(--success);
            color: #166534;
        }

        .lesion-abnormal {
            background: var(--danger-bg);
            border-left-color: var(--danger);
            color: #991b1b;
        }

        .lesion-warning {
            background: var(--warning-bg);
            border-left-color: var(--warning);
            color: #92400e;
        }

        .lesion-ruled-out {
            background: #f1f5f9;
            border-left-color: #94a3b8;
            color: #64748b;
        }

        .lesion-paraspinal {
            background: #f3e8ff;
            border-left-color: #9333ea;
            color: #6b21a8;
        }

        /* --- UTILITY BUTTONS --- */
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-outline-danger {
            background: transparent;
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-outline-danger:hover {
            background: var(--danger-bg);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>EMG Diagnosis Tool</h1>
            <p class="subtitle">快速神經肌肉診斷輔助工具</p>
        </header>

        <div class="main-grid">

            <!-- LEFT PANEL: MUSCLE PICKER -->
            <div class="card">
                <div class="card-header">
                    <h2>Muscle Picker</h2>
                </div>

                <div class="search-container">
                    <input type="text" class="search-input" id="smartSearch" placeholder="搜尋肌肉名稱或縮寫 (如: APB, C5...)"
                        onkeyup="renderCandidates()">
                </div>

                <div class="filter-group">
                    <span class="filter-label">By Region / Plexus</span>
                    <div class="chips" id="nerveFilters"></div>
                </div>

                <div class="filter-group">
                    <span class="filter-label">By Root Level</span>
                    <div class="chips" id="rootFilters"></div>
                </div>

                <div style="border-top: 1px solid var(--border); margin: 10px 0;"></div>

                <div class="filter-label" style="margin-bottom:10px;">搜尋結果</div>
                <div id="candidateList" class="candidate-list"></div>
            </div>

            <!-- RIGHT PANEL: EXAM & ANALYSIS -->
            <div class="card">
                <div class="card-header">
                    <h2>Exam Findings</h2>
                    <button class="btn btn-outline-danger" onclick="clearExam()">Clear All</button>
                </div>

                <div id="examList" class="exam-list">
                    <!-- Exam items will appear here -->
                </div>

                <div class="analysis-section">
                    <div class="analysis-header">
                        <span class="analysis-title">Diagnostic Analysis</span>
                        <button class="btn btn-primary" onclick="copyReport()">Copy Report</button>
                    </div>
                    <div id="analysisResult">
                        <div style="color: var(--text-muted); font-size: 0.9rem;">等待資料...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

            { "m": "Gracilis", "n": "Obturator N.", "r": "L2-L4", "r_list": ["L2", "L3", "L4"], "a": [] },
            { "m": "Obturator Externus", "n": "Obturator N.", "r": "L3-L4", "r_list": ["L3", "L4"], "a": [] },

            { "m": "Gluteus Medius", "n": "Sup. Gluteal N.", "r": "L4-S1", "r_list": ["L4", "L5", "S1"], "a": ["GMed", "Glut Med"] },
            { "m": "Gluteus Minimus", "n": "Sup. Gluteal N.", "r": "L4-S1", "r_list": ["L4", "L5", "S1"], "a": ["GMin", "Glut Min"] },
            { "m": "Tensor Fasciae Latae", "n": "Sup. Gluteal N.", "r": "L4-S1", "r_list": ["L4", "L5", "S1"], "a": ["TFL"] },
            { "m": "Gluteus Major", "n": "Inf. Gluteal N.", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["GMax", "Glut Max"] },

            { "m": "Piriformis", "n": "Sacral Plexus", "r": "S1-S2", "r_list": ["S1", "S2"], "a": [] },
            { "m": "Obturator Int / Gemelli", "n": "Sacral Plexus", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["Obt Int"] },
            { "m": "Quadratus Femoris", "n": "Sacral Plexus", "r": "L4-S1", "r_list": ["L4", "L5", "S1"], "a": ["Quad Fem"] },

            // Hamstrings
            { "m": "Semitendinosus", "n": "Sciatic (Tibial)", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["Semi T", "ST"] },
            { "m": "Semimembranosus", "n": "Sciatic (Tibial)", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["Semi M", "SM"] },
            { "m": "Biceps Femoris (Long Head)", "n": "Sciatic (Tibial)", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["BFLH"] },
            { "m": "Biceps Femoris (Short Head)", "n": "Sciatic (Peroneal)", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["BFSH"] },

            // Leg (Anterior/Lateral)
            { "m": "Tibialis Anterior", "n": "Deep Peroneal N.", "r": "L4-L5", "r_list": ["L4", "L5"], "a": ["TA"] },
            { "m": "Extensor Hallucis Longus", "n": "Deep Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["EHL"] },
            { "m": "Extensor Digitorum Longus", "n": "Deep Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["EDL"] },
            { "m": "Extensor Digitorum Brevis", "n": "Deep Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["EDB"] },
            { "m": "Extensor Hallucis Brevis", "n": "Deep Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["EHB"] },
            { "m": "Peroneus Longus", "n": "Sup. Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["PL", "Fibularis"] },
            { "m": "Peroneus Brevis", "n": "Sup. Peroneal N.", "r": "L5-S1", "r_list": ["L5", "S1"], "a": ["PB", "Fibularis"] },

            // Leg (Posterior)
            { "m": "Gastrocnemius (Med/Lat)", "n": "Tibial N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": ["Gastroc", "GCM", "GCL"] },
            { "m": "Soleus", "n": "Tibial N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": ["SOL"] },
            { "m": "Popliteus", "n": "Tibial N.", "r": "L4-S1", "r_list": ["L4", "L5", "S1"], "a": [] },
            { "m": "Tibialis Posterior", "n": "Tibial N.", "r": "L4-L5", "r_list": ["L4", "L5"], "a": ["TP", "Tib Post"] },
            { "m": "Flexor Digitorum Longus", "n": "Tibial N.", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["FDL"] },
            { "m": "Flexor Hallucis Longus", "n": "Tibial N.", "r": "L5-S2", "r_list": ["L5", "S1", "S2"], "a": ["FHL"] },

            // Foot
            { "m": "Abductor Hallucis", "n": "Med. Plantar N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": ["AH"] },
            { "m": "Flexor Digitorum Brevis", "n": "Med. Plantar N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": ["FDB"] },
            { "m": "Abductor Digiti Quinti", "n": "Lat. Plantar N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": ["ADQ"] },
            { "m": "Interossei (Foot)", "n": "Lat. Plantar N.", "r": "S1-S2", "r_list": ["S1", "S2"], "a": [] },

            // --- Sphincters ---
            { "m": "Ext. Anal Sphincter", "n": "Pudendal N.", "r": "S2-S4", "r_list": ["S2", "S3", "S4"], "a": ["EAS", "Sphincter"] },
            { "m": "Bulbocavernosus", "n": "Pudendal N.", "r": "S2-S4", "r_list": ["S2", "S3", "S4"], "a": ["BC"] }
        ];

        // Sort DB
        db.sort((a, b) => a.m.localeCompare(b.m));

        // --- GLOBAL STATE ---
        let examData = [];
        let activeRootFilter = null;
        let activeNerveFilter = null;

        // --- INITIALIZATION ---
        const roots = ["VII", "XI", "XII", "C5", "C6", "C7", "C8", "T1", "L2", "L3", "L4", "L5", "S1", "S2", "S3", "S4"];
        const nerves = ["Cranial", "Brachial", "Median", "Ulnar", "Radial", "Femoral", "Sciatic", "Peroneal", "Tibial", "Paraspinal"];

        window.onload = function () {
            // Build Filter Chips
            const rCont = document.getElementById('rootFilters');
            roots.forEach(r => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = r;
                chip.onclick = () => setRootFilter(r, chip);
                rCont.appendChild(chip);
            });

            const nCont = document.getElementById('nerveFilters');
            nerves.forEach(n => {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerText = n;
                chip.onclick = () => setNerveFilter(n, chip);
                nCont.appendChild(chip);
            });

            renderCandidates();
            renderExamList();
        };

        // --- PICKER LOGIC ---
        function setRootFilter(root, el) {
            if (activeRootFilter === root) {
                activeRootFilter = null;
                el.classList.remove('active');
            } else {
                activeRootFilter = root;
                document.querySelectorAll('#rootFilters .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            renderCandidates();
        }

        function setNerveFilter(nerve, el) {
            if (activeNerveFilter === nerve) {
                activeNerveFilter = null;
                el.classList.remove('active');
            } else {
                activeNerveFilter = nerve;
                document.querySelectorAll('#nerveFilters .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            }
            renderCandidates();
        }

        function renderCandidates() {
            const container = document.getElementById('candidateList');
            const search = document.getElementById('smartSearch').value.toLowerCase().trim();
            container.innerHTML = '';

            const filtered = db.filter(item => {
                let matchText = false;
                if (item.m.toLowerCase().includes(search)) matchText = true;
                if (item.n.toLowerCase().includes(search)) matchText = true;
                if (item.a && item.a.some(abbr => abbr.toLowerCase().includes(search))) matchText = true;

                if (search && !matchText) return false;

                if (activeRootFilter) {
                    if (activeRootFilter.includes("Paraspinal")) {
                        if (!item.n.includes("Post. Rami")) return false;
                    } else if (!item.r_list.includes(activeRootFilter) && !item.r.includes(activeRootFilter)) return false;
                }

                if (activeNerveFilter) {
                    const nFilter = activeNerveFilter.toLowerCase();
                    if (nFilter === 'cranial' && !["vii", "v", "xi", "xii"].some(r => item.r.toLowerCase().includes(r))) return false;
                    else if (nFilter === 'paraspinal' && !item.n.toLowerCase().includes('post. rami')) return false;
                    else if (nFilter === 'brachial' && (!['C5', 'C6', 'C7', 'C8', 'T1'].some(r => item.r_list.includes(r)) || item.n.includes('Radial') || item.n.includes('Median') || item.n.includes('Ulnar'))) return false;
                    else if (!['cranial', 'paraspinal', 'brachial'].includes(nFilter) && !item.n.toLowerCase().includes(nFilter)) return false;
                }

                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:20px;">查無肌肉</div>';
                return;
            }

            filtered.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'candidate-item';

                let abbrTag = (item.a && item.a.length > 0) ? `<span class="cand-abbr">${item.a[0]}</span>` : '';

                btn.innerHTML = `
                ${abbrTag}
                <span class="cand-name">${item.m}</span>
                <span class="cand-meta">${item.r} | ${item.n}</span>
            `;
                btn.onclick = () => addExamItem(item);
                container.appendChild(btn);
            });
        }

        // --- EXAM & DIAGNOSIS LOGIC ---
        function addExamItem(item) {
            const uniqueId = item.m + item.n;
            if (examData.find(e => (e.data.m + e.data.n) === uniqueId)) return;

            examData.push({ data: item, status: 0 }); // 0: Undetermined, 1: Abnormal, 2: Normal
            renderExamList();
            document.getElementById('smartSearch').value = '';
            renderCandidates();
        }

        function setStatus(index, status) {
            examData[index].status = status;
            renderExamList();
            runAnalysis();
        }

        function removeExamItem(index, e) {
            if (e) e.stopPropagation();
            examData.splice(index, 1);
            renderExamList();
            runAnalysis();
        }

        function clearExam() {
            if (examData.length > 0) {
                if (confirm("確定要清除所有檢查項目嗎?")) {
                    examData = [];
                    renderExamList();
                    runAnalysis();
                }
            }
        }

        function renderExamList() {
            const container = document.getElementById('examList');
            container.innerHTML = '';

            if (examData.length === 0) {
                container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size:2rem; margin-bottom:10px;">📋</div>
                    尚未加入肌肉<br>請從左側點擊加入
                </div>`;
                return;
            }

            examData.forEach((item, idx) => {
                const m = item.data;

                const div = document.createElement('div');
                div.className = `exam-item`;

                // Status Buttons
                const btnNormalClass = item.status === 2 ? 'active-normal' : '';
                const btnAbnormalClass = item.status === 1 ? 'active-abnormal' : '';

                div.innerHTML = `
                <div class="exam-info">
                    <span class="exam-name">${m.m}</span>
                    <span class="exam-meta">${m.n} (${m.r})</span>
                </div>
                <div class="exam-controls">
                    <button class="status-btn ${btnNormalClass}" onclick="setStatus(${idx}, 2)">
                        ${item.status === 2 ? '✓' : ''} 正常
                    </button>
                    <button class="status-btn ${btnAbnormalClass}" onclick="setStatus(${idx}, 1)">
                        ${item.status === 1 ? '!' : ''} 異常
                    </button>
                    <button class="btn-remove" onclick="removeExamItem(${idx}, event)" title="移除">×</button>
                </div>
            `;
                container.appendChild(div);
            });
        }

        function runAnalysis() {
            const container = document.getElementById('analysisResult');
            const abnormal = examData.filter(e => e.status === 1);
            const normal = examData.filter(e => e.status === 2);

            if (abnormal.length === 0 && normal.length === 0) {
                container.innerHTML = '<div style="color:#94a3b8; padding:10px;">等待資料...</div>';
                return;
            }
            if (abnormal.length === 0) {
                container.innerHTML = '<div class="lesion-card lesion-normal"><h4 style="margin:0 0 5px 0;">🟢 Normal Study</h4>所有測試肌肉皆正常。</div>';
                return;
            }

            // Logic
            let rootCounts = {};
            let nerveCounts = {};

            abnormal.forEach(item => {
                const info = item.data;
                info.r_list.forEach(r => rootCounts[r] = (rootCounts[r] || 0) + 1);
                nerveCounts[info.n] = (nerveCounts[info.n] || 0) + 1;
            });

            let likelyRoots = Object.keys(rootCounts).filter(r => rootCounts[r] === abnormal.length);
            let likelyNerves = Object.keys(nerveCounts).filter(n => nerveCounts[n] === abnormal.length);

            let ruledOutRoots = [];
            let confirmedRoots = [];

            likelyRoots.forEach(root => {
                const contradictions = normal.filter(nItem => {
                    const nInfo = nItem.data;
                    return nInfo.r_list.includes(root);
                });

                if (contradictions.length > 0) {
                    const reasons = contradictions.map(c => `${c.data.m}(${c.data.n})`).join(", ");
                    ruledOutRoots.push({
                        root: root,
                        reason: `但正常肌肉包含: ${reasons}。`
                    });
                } else {
                    confirmedRoots.push(root);
                }
            });

            let html = '';
            if (likelyNerves.length > 0) {
                html += `<div class="lesion-card lesion-abnormal"><h4>🔴 Peripheral Nerve?</h4><p style="margin:0;">符合模式: <strong>${likelyNerves.join(", ")}</strong></p></div>`;
            }
            if (confirmedRoots.length > 0) {
                html += `<div class="lesion-card lesion-abnormal"><h4>🔴 Radiculopathy?</h4><p style="margin:0;">高度懷疑 Root: <strong>${confirmedRoots.join(", ")}</strong></p></div>`;
            }
            if (ruledOutRoots.length > 0) {
                html += `<div class="lesion-card lesion-ruled-out"><h4>❌ 排除或需鑑別</h4>${ruledOutRoots.map(item => `<p style="font-size:0.85rem; margin-bottom:5px;"><strong>${item.root}</strong> 符合異常，<br>${item.reason}</p>`).join("")}</div>`;
            }

            const hasParaspinal = abnormal.some(i => i.data.n.includes("Post. Rami"));
            if (hasParaspinal) {
                html += `<div class="lesion-card lesion-paraspinal"><h4>🟣 Paraspinal Finding</h4><p style="margin:0;">脊椎旁肌異常強烈提示神經根病變 (Radiculopathy) 而非 Plexus/Peripheral。</p></div>`;
            }

            if (confirmedRoots.length === 0 && likelyNerves.length === 0 && ruledOutRoots.length === 0) {
                const possibleRoots = Object.keys(rootCounts).filter(r => rootCounts[r] > 0);
                possibleRoots.sort((a, b) => rootCounts[b] - rootCounts[a]);
                html += `<div class="lesion-card lesion-warning"><h4>🟠 混合型 / 多節病變?</h4><p style="margin:0; font-size:0.9rem;">無單一解釋。涉及節段: ${possibleRoots.map(r => `${r}(${rootCounts[r]})`).join(", ")}</p></div>`;
            }
            container.innerHTML = html;
        }

        function copyReport() {
            const analysisDiv = document.getElementById('analysisResult');
            if (!analysisDiv || analysisDiv.innerText.includes("等待資料")) {
                alert("目前沒有分析結果可複製。");
                return;
            }

            let reportText = "--- EMG Analysis Report ---\n";

            // Add Findings
            const abnormal = examData.filter(e => e.status === 1);
            const normal = examData.filter(e => e.status === 2);

            if (abnormal.length > 0) {
                reportText += "\n[Abnormal Findings]\n";
                abnormal.forEach(item => {
                    reportText += `- ${item.data.m} (${item.data.n}, ${item.data.r})\n`;
                });
            }

            if (normal.length > 0) {
                reportText += "\n[Normal Findings]\n";
                normal.forEach(item => {
                    reportText += `- ${item.data.m}\n`;
                });
            }

            reportText += "\n[Analysis]\n";
            reportText += analysisDiv.innerText.replace(/\n\n/g, "\n");

            navigator.clipboard.writeText(reportText).then(() => {
                alert("報告已複製到剪貼簿！");
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert("複製失敗，請手動複製。");
            });
        }
    </script>
